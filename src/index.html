  <script>
    // js: liga as animações (kit /animacoes-site). js-abrindo: até a 1ª pintura, as seções
    // abaixo do hero ficam fora do layout (99-desempenho.css). Sai na 1ª pintura ou em 2,5 s.
    (function () {
      var h = document.documentElement
      h.classList.add('js', 'js-abrindo')
      var pronto = function () { h.classList.remove('js-abrindo') }
      try {
        new PerformanceObserver(function (l) { if (l.getEntriesByName('first-contentful-paint').length) pronto() }).observe({ type: 'paint', buffered: true })
      } catch (e) { pronto() }
      setTimeout(pronto, 2500)
    })()
  </script>

  <style>

    @font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/Inter-latin-var.woff2') format('woff2'); }
    :root { --verde: #0A6B41; --luz: #2EE07E; --amarelo: #F2D72B; --preto: #141110; --titulo: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; --texto: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { color-scheme: dark; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1rem, 4.2vw, 4rem);
      overflow-x: hidden;
      color: #fff;
      font: 400 1rem/1.55 var(--texto);
      background:
        radial-gradient(45% 55% at 78% 30%, rgb(46 224 126 / .2), rgb(46 224 126 / 0) 70%),
        radial-gradient(50% 60% at 0% 100%, rgb(10 107 65 / .55), rgb(10 107 65 / 0) 70%),
        linear-gradient(180deg, #05402A 0%, #04301F 55%, #032417 100%);
    }
    .logo img { display: block; width: clamp(9rem, 14vw, 12rem); height: auto; }
    main { position: relative; display: grid; align-content: center; justify-items: start; gap: 1.25rem; width: min(100%, 72rem); padding-block: 3rem 4rem; }
    .num {
      font: 700 clamp(7rem, 4rem + 18vw, 16rem)/.85 var(--titulo);
      font-stretch: 112%;
      letter-spacing: -.04em;
      color: transparent;
      -webkit-text-stroke: 2px rgb(46 224 126 / .55);
      user-select: none;
    }
    .num span { color: var(--amarelo); -webkit-text-stroke: 0; }
    .rotulo { display: inline-flex; align-items: center; gap: .875rem; font-size: .875rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--amarelo); }
    .rotulo::after { content: ''; width: 4.5rem; height: 2px; background: var(--amarelo); }
    h1 { max-width: 14em; font: 600 clamp(2rem, 1.2rem + 3vw, 3.5rem)/1.05 var(--titulo); font-stretch: 106%; letter-spacing: -.01em; }
    p { max-width: 34rem; font-size: clamp(1.0625rem, 1rem + .25vw, 1.1875rem); color: rgb(255 255 255 / .82); }
    .botoes { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: .75rem; }
    .botao { display: inline-flex; align-items: center; justify-content: center; gap: .625rem; min-height: 3.5rem; padding: .875rem 1.75rem; border-radius: 999px; font: 600 1.0625rem/1 var(--titulo); text-decoration: none; transition: transform .25s cubic-bezier(.22, 1, .36, 1), background-color .25s, border-color .25s; }
    .botao svg { width: 1.25rem; height: 1.25rem; flex: none; }
    .botao--amarelo { color: var(--preto); background: var(--amarelo); box-shadow: 0 0 2rem -.25rem rgb(242 215 43 / .45); }
    .botao--vidro { color: #fff; background: rgb(46 224 126 / .08); border: 1.5px solid rgb(46 224 126 / .55); }
    .botao--vidro svg { color: var(--luz); }
    .botao:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 3px; }
    @media (hover: hover) {
      .botao:hover { transform: translate3d(0, -2px, 0); }
      .botao--vidro:hover { border-color: var(--luz); background: rgb(46 224 126 / .14); }
    }
    .curva { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(5rem, 11vw, 9rem); pointer-events: none; }
    .curva path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
    @media (max-width: 29.99em) { .botoes, .botao { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .botao { transition: none; } }
  </style>
